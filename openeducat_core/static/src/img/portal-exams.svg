<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Exam document sheet -->
  <rect x="13" y="10" width="38" height="48" rx="5" fill="#FFF2E8"/>
  <rect x="13" y="10" width="38" height="48" rx="5" stroke="#374874" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top header ribbon / banner -->
  <rect x="13" y="10" width="38" height="10" rx="3" fill="#FBDBD0"/>
  <line x1="13" y1="20" x2="51" y2="20" stroke="#374874" stroke-width="2"/>
  <!-- A+ score badge circle -->
  <circle cx="25" cy="35" r="9" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  <text x="25" y="39" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#EF4444" text-anchor="middle">A+</text>
  <!-- Question / test lines -->
  <line x1="39" y1="31" x2="45" y2="31" stroke="#374874" stroke-width="2" stroke-linecap="round"/>
  <line x1="39" y1="37" x2="45" y2="37" stroke="#374874" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="49" x2="44" y2="49" stroke="#374874" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Small graduation star / seal in corner -->
  <polygon points="50,4 52,9 57,9 53,12 55,17 50,14 45,17 47,12 43,9 48,9" fill="#FBBF24" stroke="#374874" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
